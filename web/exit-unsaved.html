<header class="page-head">
  <div>
    <p class="eyebrow">Program</p>
    <h1>Exit Program</h1>
    <p class="page-lead">Stops the program on this computer. Run <code>run.bat</code> to start it again.</p>
  </div>
</header>

<!-- message -->

<section class="card card-narrow">
  <div class="card-body">
    <div class="alert alert-warning" role="alert">
      <svg class="icon" aria-hidden="true"><use href="#i-exclamation-triangle"></use></svg>
      <div>
        <p><strong>You have unsaved changes.</strong> Courses added since your last save will be lost if you exit now.</p>
      </div>
    </div>
    <div class="actions">
      <a class="button primary" href="/?view=save">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-down-tray"></use></svg>
        Save first
      </a>
      <form method="post" action="/exit">
        <input type="hidden" name="action" value="discard">
        <button class="button danger-outline" type="submit">Exit without saving</button>
      </form>
      <a class="button secondary" href="/">Cancel</a>
    </div>
  </div>
</section>
